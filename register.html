<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HealthCare AI System</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #0d142b, #141a38, #24194b);
        }

        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: rgba(20, 26, 56, 0.96);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            color: #a78bfa;
        }

        .subtitle {
            text-align: center;
            color: #c5c9df;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #41476b;
            border-radius: 8px;
            background: #0d142b;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #8b5cf6;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #c5c9df;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .disclaimer {
            margin-top: 22px;
            text-align: center;
            color: #9299b7;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="register-card">

        <h1 class="logo">HealthCare AI</h1>
        <p class="subtitle">Create your account</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <p id="message" class="message" role="status" aria-live="polite"></p>

        </form>

        <p class="links">
            Already have an account?
            <a href="index.html">Login here</a>
        </p>

        <p class="disclaimer">
            Educational AI project. Not intended for medical diagnosis.
        </p>

    </main>
</body>
</html>
